# Шаг 5: весь стек. Снаружи открыт только proxy (Caddy): 80/443.
# На VDS для Elasticsearch рекомендуется:  sudo sysctl -w vm.max_map_count=262144  (и 4 ГБ RAM на весь стек).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d comments"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    volumes: [rabbitdata:/var/lib/rabbitmq]
    ports: ["127.0.0.1:15672:15672"]   # веб-консоль только с самого сервера
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: [esdata:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/Comments.Api/Dockerfile
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=comments;Username=app;Password=${DB_PASSWORD}
      Redis__Connection: redis:6379
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: app
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Elastic__Url: http://elasticsearch:9200
      Storage__Root: /app/uploads
    volumes: [uploads:/app/uploads]
    ports: ["127.0.0.1:8080:8080"]   # только локально (для Vite dev-сервера); наружу — через proxy
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      elasticsearch: { condition: service_started }   # поиск необязателен для работы остальных функций

  worker:
    build:
      context: .
      dockerfile: src/Comments.Worker/Dockerfile
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=comments;Username=app;Password=${DB_PASSWORD}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: app
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Elastic__Url: http://elasticsearch:9200
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }

  web:
    build: ./web

  proxy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

volumes:
  pgdata:
  rabbitdata:
  esdata:
  uploads:
  caddy_data:
  caddy_config:
